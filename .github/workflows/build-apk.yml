name: APK Derle

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bagimliliklari kur
        run: npm install

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android platformunu senkronize et
        run: npx cap sync android

      - name: Debug APK derle
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: APK'yi yukle
        uses: actions/upload-artifact@v4
        with:
          name: kodcu-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: APK'yi depoya isle
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/app-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/app-debug.apk
          git commit -m "APK derlendi [skip ci]" || echo "Degisiklik yok"
          git push
