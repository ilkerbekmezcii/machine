name: Android ARM64 Compatibility Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-arm64-emulator-test.yml"

permissions:
  contents: read

jobs:
  arm64-compatibility-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout private Alpine source
        uses: actions/checkout@v5
        with:
          repository: ilkerbekmezcii/alpine-linux-android
          ref: main
          token: ${{ secrets.INTERNALKEY }}
          path: src
          persist-credentials: false
          fetch-depth: 1

      - name: Enable ARM64 binfmt for runtime build
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build production ARM64 Alpine runtime
        shell: bash
        run: sudo bash src/scripts/build-runtime.sh "$GITHUB_WORKSPACE/src"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: src/**/*.gradle*

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools emulator"

      - name: Enable KVM access when available
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            test -r /dev/kvm
            test -w /dev/kvm
            ls -l /dev/kvm
          else
            echo "::warning::/dev/kvm is unavailable; emulator runner will use software acceleration if supported."
          fi

      - name: Run production ARM64 terminal through Android native bridge
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          working-directory: src
          script: |
            echo "=== Source revision ==="
            git rev-parse HEAD
            echo "=== Emulator ABI / native bridge ==="
            adb shell getprop ro.product.cpu.abilist
            adb shell getprop ro.product.cpu.abi
            adb shell getprop ro.dalvik.vm.native.bridge
            adb shell getprop ro.product.cpu.abilist | tr -d '\r' | grep -F "arm64-v8a"
            test "$(adb shell getprop ro.dalvik.vm.native.bridge | tr -d '\r')" = "libndk_translation.so"
            chmod +x gradlew
            ./gradlew :app:installDebug :app:installDebugAndroidTest --stacktrace
            adb logcat -c
            adb shell am instrument -w -r com.ilker.linuxterminal.test/sh.gravital.shell.TerminalRegression > /tmp/instrumentation-arm64.txt 2>&1 || true
            cat /tmp/instrumentation-arm64.txt
            grep -F "PASS: native IME, Termux PTY" /tmp/instrumentation-arm64.txt || (adb logcat -d -v brief | grep -E "MainActivity|RuntimeBootstrapper|TerminalController|TerminalSession|AndroidRuntime|proot|linker" || true; false)
            if grep -F "FAIL:" /tmp/instrumentation-arm64.txt; then exit 1; fi

      - name: Upload ARM64 compatibility output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-compatibility-output
          path: |
            /tmp/instrumentation-arm64.txt
            src/app/build/outputs/apk/
            src/app/build/outputs/apk/androidTest/
          if-no-files-found: warn
          retention-days: 1
