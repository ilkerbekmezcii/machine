name: Android ARM64 Emulator Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-arm64-emulator-test.yml"

permissions:
  contents: read

jobs:
  arm64-emulator-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout private Alpine source
        uses: actions/checkout@v5
        with:
          repository: ilkerbekmezcii/alpine-linux-android
          ref: main
          token: ${{ secrets.INTERNALKEY }}
          path: src
          persist-credentials: false
          fetch-depth: 1

      - name: Enable ARM64 binfmt for runtime build
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build Alpine runtime
        shell: bash
        run: sudo bash src/scripts/build-runtime.sh "$GITHUB_WORKSPACE/src"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: src/**/*.gradle*

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools emulator"

      - name: Run terminal regression on native ARM64 Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: arm64-v8a
          profile: Nexus 5X
          cores: 2
          ram-size: 3072M
          heap-size: 384M
          emulator-boot-timeout: 1200
          disable-animations: true
          disable-linux-hw-accel: true
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -accel off
          working-directory: src
          script: |
            echo "=== Source revision ==="
            git rev-parse HEAD
            echo "=== Android guest ABI ==="
            adb shell getprop ro.product.cpu.abilist
            adb shell getprop ro.product.cpu.abi
            adb shell getprop ro.dalvik.vm.native.bridge
            test "$(adb shell getprop ro.product.cpu.abi | tr -d '\r')" = "arm64-v8a"
            test -z "$(adb shell getprop ro.dalvik.vm.native.bridge | tr -d '\r')"
            chmod +x gradlew
            ./gradlew :app:installDebug :app:installDebugAndroidTest --stacktrace
            adb logcat -c
            adb shell am instrument -w -r com.ilker.linuxterminal.test/sh.gravital.shell.TerminalRegression > /tmp/instrumentation-arm64.txt 2>&1 || true
            cat /tmp/instrumentation-arm64.txt
            grep -F "PASS: native IME, Termux PTY" /tmp/instrumentation-arm64.txt || (adb logcat -d -v brief | grep -E "MainActivity|RuntimeBootstrapper|TerminalController|TerminalSession|AndroidRuntime|proot|linker" || true; false)
            if grep -F "FAIL:" /tmp/instrumentation-arm64.txt; then exit 1; fi

      - name: Upload ARM64 emulator test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-emulator-test-output
          path: |
            /tmp/instrumentation-arm64.txt
            src/app/build/outputs/apk/
            src/app/build/outputs/apk/androidTest/
          if-no-files-found: warn
          retention-days: 1
