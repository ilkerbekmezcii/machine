name: ARM64 Production Runtime Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-arm64-emulator-test.yml"

concurrency:
  group: arm64-production-runtime-validation
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  arm64-runtime-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout private Alpine source
        uses: actions/checkout@v5
        with:
          repository: ilkerbekmezcii/alpine-linux-android
          ref: main
          token: ${{ secrets.INTERNALKEY }}
          path: src
          persist-credentials: false
          fetch-depth: 1

      - name: Record source revision
        shell: bash
        run: git -C src rev-parse HEAD | tee /tmp/source-commit.txt

      - name: Enable ARM64 binfmt
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build and execute production ARM64 runtime
        shell: bash
        run: sudo bash src/scripts/build-runtime.sh "$GITHUB_WORKSPACE/src"

      - name: Verify ARM64 PRoot binaries
        shell: bash
        run: |
          file src/app/src/main/jniLibs/arm64-v8a/libproot.so
          file src/app/src/main/jniLibs/arm64-v8a/libproot-loader.so
          readelf -h src/app/src/main/jniLibs/arm64-v8a/libproot.so | tee /tmp/proot-elf.txt
          readelf -h src/app/src/main/jniLibs/arm64-v8a/libproot-loader.so | tee /tmp/loader-elf.txt
          grep -F "Machine:" /tmp/proot-elf.txt | grep -F "AArch64"
          grep -F "Machine:" /tmp/loader-elf.txt | grep -F "AArch64"

      - name: Verify bundled rootfs commands
        shell: bash
        run: |
          ROOTFS=src/app/src/main/assets/alpine-rootfs-aarch64.tgz
          test -s "$ROOTFS"
          tar -tzf "$ROOTFS" > /tmp/rootfs-files.txt
          grep -E '^\./sbin/apk$|^sbin/apk$' /tmp/rootfs-files.txt
          grep -E '^\./usr/bin/curl$|^usr/bin/curl$' /tmp/rootfs-files.txt
          grep -E '^\./usr/bin/node$|^usr/bin/node$' /tmp/rootfs-files.txt
          grep -E '^\./usr/bin/npm$|^usr/bin/npm$' /tmp/rootfs-files.txt
          grep -E '^\./usr/bin/npx$|^usr/bin/npx$' /tmp/rootfs-files.txt
          test -s src/app/src/main/assets/runtime.sha256

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: src/**/*.gradle*

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build production ARM64 APK
        working-directory: src
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Verify production APK architecture
        working-directory: src
        shell: bash
        run: |
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          unzip -l "$APK" | tee /tmp/arm64-apk-contents.txt
          grep -F "assets/alpine-rootfs-aarch64.tgz" /tmp/arm64-apk-contents.txt
          grep -F "lib/arm64-v8a/libproot.so" /tmp/arm64-apk-contents.txt
          grep -F "lib/arm64-v8a/libproot-loader.so" /tmp/arm64-apk-contents.txt
          grep -F "lib/arm64-v8a/libtermux.so" /tmp/arm64-apk-contents.txt
          if grep -E "lib/(x86|x86_64|armeabi-v7a)/" /tmp/arm64-apk-contents.txt; then
            echo "Unexpected non-ARM64 native library in production APK"
            exit 1
          fi
          sha256sum "$APK" | tee /tmp/arm64-apk.sha256

      - name: Upload ARM64 validation output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm64-production-runtime-validation
          path: |
            /tmp/source-commit.txt
            /tmp/proot-elf.txt
            /tmp/loader-elf.txt
            /tmp/rootfs-files.txt
            /tmp/arm64-apk-contents.txt
            /tmp/arm64-apk.sha256
            src/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 7
