name: Build Alpine APK

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout private Alpine source
        uses: actions/checkout@v5
        with:
          repository: ilkerbekmezcii/alpine-linux-android
          ref: main
          token: ${{ secrets.INTERNALKEY }}
          path: src
          persist-credentials: false
          fetch-depth: 1
      - name: Enable ARM64 binfmt
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Prepare Alpine rootfs
        shell: bash
        run: sudo bash src/scripts/prepare-rootfs.sh "$GITHUB_WORKSPACE/src"
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: src/**/*.gradle*
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Install Android NDK
        shell: bash
        run: "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;28.0.13004108"
      - name: Install Rust Android targets
        shell: bash
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked --version 4.1.2
      - name: Run host-side simulation tests
        working-directory: src/session-manager
        run: cargo test -p gravitalshell-core --all-targets
      - name: Build Rust JNI
        working-directory: src
        shell: bash
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/28.0.13004108"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          NDK_PREBUILT="$(find "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          export PATH="$NDK_PREBUILT/bin:$PATH"
          rm -f app/src/main/jniLibs/arm64-v8a/libgravitalshell.so
          cd session-manager
          cargo ndk -t arm64-v8a --platform 29 -o ../app/src/main/jniLibs build --release -p gravitalshell-jni
      - name: Build debug APK
        working-directory: src
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alpine-linux-android-apk
          path: src/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
