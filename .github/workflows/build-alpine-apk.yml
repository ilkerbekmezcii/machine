name: Build Alpine APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-alpine-apk.yml
      - smoke-trigger.txt

concurrency:
  group: build-alpine-apk
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout private Alpine source
        uses: actions/checkout@v5
        with:
          repository: ilkerbekmezcii/alpine-linux-android
          ref: main
          token: ${{ secrets.INTERNALKEY }}
          path: src
          persist-credentials: false
          fetch-depth: 1

      - name: Enable ARM64 binfmt
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build Alpine runtime
        shell: bash
        run: sudo bash src/scripts/build-runtime.sh "$GITHUB_WORKSPACE/src"

      - name: Simulated rootfs smoke checks
        working-directory: src
        shell: bash
        run: |
          ROOTFS="app/src/main/assets/alpine-rootfs-aarch64.tgz"
          test -s "$ROOTFS"
          tar -tzf "$ROOTFS" | sed 's#^\./##' | tee /tmp/rootfs-files.txt >/dev/null
          for required in \
            bin/bash \
            sbin/apk \
            usr/bin/curl \
            usr/bin/node \
            usr/bin/npm \
            usr/bin/npx \
            usr/bin/openssl \
            root/.profile \
            etc/motd
          do
            grep -Fx "$required" /tmp/rootfs-files.txt
          done
          if grep -Fx "etc/issue" /tmp/rootfs-files.txt; then
            echo "Unexpected startup issue banner in rootfs"
            exit 1
          fi
          if grep -Fx "etc/issue.net" /tmp/rootfs-files.txt; then
            echo "Unexpected network issue banner in rootfs"
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: src/**/*.gradle*

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: src
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Verify bundled ARM64 runtime
        working-directory: src
        shell: bash
        run: |
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          unzip -l "$APK" | tee /tmp/apk-contents.txt
          grep -F "assets/alpine-rootfs-aarch64.tgz" /tmp/apk-contents.txt
          grep -F "assets/runtime.sha256" /tmp/apk-contents.txt
          grep -F "lib/arm64-v8a/libproot.so" /tmp/apk-contents.txt
          grep -F "lib/arm64-v8a/libproot-loader.so" /tmp/apk-contents.txt
          grep -F "lib/arm64-v8a/libtalloc.so" /tmp/apk-contents.txt
          grep -F "lib/arm64-v8a/libandroid-shmem.so" /tmp/apk-contents.txt
          if grep -E "lib/(x86|x86_64|armeabi-v7a)/" /tmp/apk-contents.txt; then
            echo "Unexpected non-ARM64 native library in APK"
            exit 1
          fi

      - name: Record build provenance
        working-directory: src
        shell: bash
        run: |
          OUT="app/build/outputs/apk/debug"
          APK="$(find "$OUT" -maxdepth 1 -name '*.apk' -print -quit)"
          git rev-parse HEAD > "$OUT/source-commit.txt"
          sha256sum "$APK" > "$OUT/SHA256SUMS"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alpine-terminal-v2-apk
          path: |
            src/app/build/outputs/apk/debug/*.apk
            src/app/build/outputs/apk/debug/SHA256SUMS
            src/app/build/outputs/apk/debug/source-commit.txt
          if-no-files-found: error
          retention-days: 7
