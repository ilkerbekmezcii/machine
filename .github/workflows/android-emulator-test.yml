name: Android Emulator Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-emulator-test.yml"

concurrency:
  group: android-emulator-test
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  emulator-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout private Alpine source
        uses: actions/checkout@v5
        with:
          repository: ilkerbekmezcii/alpine-linux-android
          ref: main
          token: ${{ secrets.INTERNALKEY }}
          path: src
          persist-credentials: false
          fetch-depth: 1

      - name: Record source revision
        shell: bash
        run: git -C src rev-parse HEAD | tee /tmp/source-commit.txt

      - name: Build native x86_64 Alpine runtime for emulator
        shell: bash
        run: sudo env RUNTIME_ABI=x86_64 bash src/scripts/build-runtime.sh "$GITHUB_WORKSPACE/src"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: src/**/*.gradle*

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools emulator"

      - name: Enable KVM access when available
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            test -r /dev/kvm
            test -w /dev/kvm
            ls -l /dev/kvm
          else
            echo "::warning::/dev/kvm is unavailable; emulator runner will fall back to software acceleration if supported."
          fi

      - name: Run native terminal regression on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          working-directory: src
          script: |
            echo "=== Source revision ==="
            cat /tmp/source-commit.txt
            echo "=== Emulator ABI ==="
            adb shell getprop ro.product.cpu.abilist
            adb shell getprop ro.product.cpu.abilist | tr -d '\r' | grep -F "x86_64"
            chmod +x gradlew
            ./gradlew -PruntimeAbi=x86_64 :app:installDebug :app:installDebugAndroidTest --stacktrace
            adb logcat -c
            adb shell am instrument -w -r com.ilker.linuxterminal.test/sh.gravital.shell.TerminalRegression > /tmp/instrumentation.txt 2>&1 || true
            cat /tmp/instrumentation.txt
            grep -F "PASS: native IME, Termux PTY" /tmp/instrumentation.txt || (adb logcat -d -v brief | grep -E "MainActivity|RuntimeBootstrapper|TerminalController|TerminalSession|AndroidRuntime|proot" || true; false)
            if grep -F "FAIL:" /tmp/instrumentation.txt; then exit 1; fi

      - name: Upload emulator test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-test-output
          path: |
            /tmp/source-commit.txt
            /tmp/instrumentation.txt
            src/app/build/outputs/apk/
            src/app/build/outputs/apk/androidTest/
          if-no-files-found: warn
          retention-days: 1
