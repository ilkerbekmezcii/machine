name: Android Emulator Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-emulator-test.yml"

permissions:
  contents: read

jobs:
  emulator-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout private Alpine source
        uses: actions/checkout@v5
        with:
          repository: ilkerbekmezcii/alpine-linux-android
          ref: main
          token: ${{ secrets.INTERNALKEY }}
          path: src
          persist-credentials: false
          fetch-depth: 1

      - name: Enable ARM64 binfmt
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Prepare current ARM64 rootfs
        shell: bash
        run: sudo bash src/scripts/prepare-rootfs.sh "$GITHUB_WORKSPACE/src"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: src/**/*.gradle*

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools emulator"

      - name: Install Android NDK
        shell: bash
        run: sdkmanager "ndk;28.0.13004108"

      - name: Install Rust Android target
        shell: bash
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked --version 4.1.2

      - name: Build ARM64 Rust JNI
        working-directory: src
        shell: bash
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/28.0.13004108"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          export ANDROID_NDK="$ANDROID_NDK_HOME"
          NDK_PREBUILT="$(find "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          export PATH="$NDK_PREBUILT/bin:$PATH"
          rm -f app/src/main/jniLibs/arm64-v8a/libgravitalshell.so
          cd session-manager
          cargo ndk -t arm64-v8a --platform 29 -o ../app/src/main/jniLibs build --release -p gravitalshell-jni

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Run current ARM64 app regression on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          working-directory: src
          script: |
            echo "=== Emulator ABI ==="
            adb shell getprop ro.product.cpu.abilist
            adb shell getprop ro.dalvik.vm.native.bridge
            adb shell getprop ro.product.cpu.abilist | tr -d '\r' | grep -F "arm64-v8a"
            test "$(adb shell getprop ro.dalvik.vm.native.bridge | tr -d '\r')" = "libndk_translation.so"
            chmod +x gradlew
            ./gradlew :app:installDebug :app:installDebugAndroidTest --stacktrace
            adb logcat -c
            adb shell am instrument -w -r com.ilker.linuxterminal.test/sh.gravital.shell.TerminalRegression > /tmp/instrumentation.txt 2>&1 || true
            cat /tmp/instrumentation.txt
            grep -F "PASS: Termux terminal" /tmp/instrumentation.txt || (adb logcat -d -v brief | grep -E "LinuxTerminalActivity|FirstRunSetup|SessionViewModel|TermuxPtySession|TerminalSession|AndroidRuntime|proot|gravital|NoSuchMethodError" || true; false)
            if grep -F "FAIL:" /tmp/instrumentation.txt; then exit 1; fi

      - name: Upload emulator test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-test-output
          path: |
            /tmp/instrumentation.txt
            src/app/build/outputs/apk/
            src/app/build/outputs/apk/androidTest/
          if-no-files-found: warn
          retention-days: 1
